# GENERATED FROM the private project (nextui/ci/nextui-mods.yml): edit there,
# then mac/publish-nextui-mods.sh.
#
# Compile our NextUI modifications for every new NextUI release and publish
# them as a release the console downloads by itself (nextui-mods/fetch.sh).
name: NextUI mods

on:
  schedule:
    - cron: "23 */6 * * *"     # new NextUI release: prepared within 6 hours
  push:
    branches: [main]
    paths: ["nextui/**", ".github/workflows/nextui-mods.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "NextUI tag (empty: latest and TARGET)"
        required: false
      force:
        description: "Rebuild even if already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nextui-mods
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          [ "$FORCE" = true ] && args+=(--force)
          [ -n "$TAG" ] && args+=("$TAG")
          nextui/ci.sh "${args[@]}"
